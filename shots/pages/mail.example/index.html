<!doctype html>

<title>Inbox (3) · mail.example</title>
<link rel="stylesheet" href="/style.css">
<style>
  .mail { display: grid; grid-template-columns: 220px 1fr 90px; gap: 16px; padding: 14px 8px; border-bottom: 1px solid var(--line); }
  .unread { font-weight: 650; }
  .unread .from::before { content: "● "; color: var(--accent); }
  .read { color: var(--muted); }
  .when { text-align: right; color: var(--muted); }
  h1 { font-size: 22px; margin: 4px 0 12px; }
</style>
<header><span class="brand">mail.example</span><nav><a href="/">inbox</a><a href="/sent">sent</a><a href="/drafts">drafts</a></nav><span class="muted" style="margin-left:auto">signed in as you@work.example</span></header>
