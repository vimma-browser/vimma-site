# Weekly dependency updates. Minor and patch bumps arrive as one grouped PR per ecosystem;
# majors arrive one PR each. Every Dependabot PR is reviewed by a person; nothing auto-merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the oldest Node the site supports (engines ">=22", CI on Node 22),
      # so its types never offer APIs that the build's runtime lacks. Move it with that floor.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
