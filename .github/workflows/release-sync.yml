# Keep the site on Vimma's latest published release (README, "Keeping up with releases"): once a
# day, copy the release's facts, docs and keys into data/ (npm run release:sync) and, when they
# changed, open or update a pull request that merges itself once the required checks pass.
#
# A pull request opened with GITHUB_TOKEN starts no pull_request or push workflows, so this starts
# ci.yml on the branch itself (workflow_dispatch is the exception GitHub allows). Needs Settings →
# Actions → General → "Allow GitHub Actions to create and approve pull requests", and Settings →
# General → "Allow auto-merge".
name: release-sync

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "Vimma release tag (vX.Y.Z); empty for the latest published release"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # push the branch
      pull-requests: write # open or update the pull request and turn on auto-merge
      actions: write # start ci.yml on the branch
    env:
      SYNCED: >-
        data/release.json data/bindings.json data/bindings-source.json
        data/docs/guide.md data/docs/limits.md data/docs/source.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Sync the release
        id: sync
        env:
          # Event data, so it goes through env and is checked before use.
          TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }} # the API's rate limit
        run: |
          if [[ -n "$TAG" && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          npm run release:sync -- ${TAG:+"$TAG"}
          # shellcheck disable=SC2086 # SYNCED is a list of paths
          if [[ -z "$(git status --porcelain -- $SYNCED)" ]]; then
            echo "The site is already on $(node -p 'require("./data/release.json").tag')."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Put the sync on its branch
        id: branch
        if: steps.sync.outputs.changed == 'true'
        env:
          REPO: ${{ github.repository }}
        run: |
          tag=$(node -p 'require("./data/release.json").tag')
          branch="release-sync/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # Keep the synced files aside, then lay them on the branch: a new one from main, or
          # the one already open for this release, on top of whatever was pushed to it (a fix to
          # scripts/docs-pages.ts, say), never rewriting it.
          keep=$(mktemp -d)
          # shellcheck disable=SC2086
          cp --parents $SYNCED "$keep"
          git checkout --quiet -- data/
          git clean -fdq -- data/
          if git ls-remote --exit-code --heads "https://github.com/$REPO" "$branch" >/dev/null; then
            git fetch --quiet "https://github.com/$REPO" "$branch"
            git switch --quiet -c "$branch" FETCH_HEAD
          else
            git switch --quiet -c "$branch"
          fi
          cp -r "$keep/data" .

      - name: Build and check
        id: build
        if: steps.sync.outputs.changed == 'true'
        run: |
          # A failure here is reported in the pull request, which then stays red and does not
          # merge; it does not stop the workflow.
          if { npm run build && npm run check; } > build.log 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the site does not build with this release; see the pull request"
          fi
          cat build.log

      - name: Open or update the pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.branch.outputs.tag }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          BUILD_OK: ${{ steps.build.outputs.ok }}
        run: |
          read -r version firefox commit url < <(node -p \
            'const r = require("./data/release.json"); [r.version, r.firefox, r.commit, r.url].join(" ")')
          short=${commit:0:7}
          title="chore(release): sync the site with vimma $TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git add -- $SYNCED
          pushed=false
          if ! git diff --cached --quiet; then
            git commit --quiet -m "$title" -m "Vimma $version (Firefox $firefox) is the latest published release. This copies its
          facts, docs/guide.md, docs/limits.md and docs/bindings.json at the tag's commit ($short),
          so the pages, the docs and the keys describe the release a visitor downloads."
            git push --quiet "https://x-access-token:$GH_TOKEN@github.com/$REPO" "HEAD:refs/heads/$BRANCH"
            pushed=true
          fi

          {
            echo "Vimma [$TAG]($url) (Firefox $firefox) is the latest published release. This copies"
            echo "its facts into \`data/release.json\` and Vimma's \`docs/guide.md\`, \`docs/limits.md\` and"
            echo "\`docs/bindings.json\` at the tag's commit, vimma-browser/vimma@$commit, into \`data/\`."
            echo
            if [[ "$BUILD_OK" == "true" ]]; then
              echo "The site builds and passes \`npm run check\` with it. Auto-merge (squash) is on: it"
              echo "merges once the required checks pass."
            else
              echo "**The site does not build with this release, so this pull request stays red and is"
              echo "not set to merge.** Usually a guide heading, paragraph or limits section that"
              echo "\`scripts/docs-pages.ts\` names was renamed or removed upstream. The build says which:"
              echo
              echo '~~~'
              grep -E '^(Error: |✗ |\(the copy)' build.log || tail -n 20 build.log
              echo '~~~'
              echo
              echo "Fix \`scripts/docs-pages.ts\` (or the page) on this branch, then merge it by hand."
              echo "The next daily run keeps your commits and adds its own on top."
            fi
            echo
            echo "Opened by \`.github/workflows/release-sync.yml\`; CI was started on the branch with"
            echo "\`workflow_dispatch\`, since a pull request opened with the workflow's token starts none."
          } > pr-body.md

          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$title" --body-file pr-body.md
          else
            gh pr edit "$pr" --repo "$REPO" --body-file pr-body.md
          fi
          if [[ "$pushed" == "true" ]]; then
            gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          fi
          if [[ "$BUILD_OK" == "true" ]]; then
            gh pr merge "$BRANCH" --repo "$REPO" --auto --squash \
              || echo "::warning::could not turn on auto-merge: is Settings → General → Allow auto-merge on?"
          else
            gh pr merge "$BRANCH" --repo "$REPO" --disable-auto 2>/dev/null || true
          fi

          # A sync for an older release that never merged is superseded by this one.
          gh pr list --repo "$REPO" --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"release-sync/\")) | select(.headRefName != \"$BRANCH\") | .number" |
            while read -r old; do
              gh pr close "$old" --repo "$REPO" --delete-branch --comment "Superseded by the sync for $TAG."
            done
