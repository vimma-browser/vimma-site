# Keep the site on Vimma's latest published release (README, "Keeping up with releases"): when
# Vimma publishes a release (its site-dispatch.yml sends the repository_dispatch) and every hour
# as a fallback, copy the release's facts, docs and keys into data/ (npm run release:sync) and, when they
# changed, open or update a pull request that merges itself once the required checks pass.
#
# Two jobs: `sync` runs the npm code (the sync, the build and the checks) with a read-only token;
# `publish` holds the write token and runs no npm code, only git and gh on the files `sync` hands
# it, so nothing the build runs can reach that token.
#
# A push made with GITHUB_TOKEN starts no workflows, so `publish` starts ci.yml on the branch
# itself (workflow_dispatch is the exception GitHub allows). The pull request's own ci run does
# start, but github-actions[bot] is an outside contributor to the repository, so that run waits
# for approval (Settings → Actions → General, "Approval for running fork pull request workflows")
# and its waiting check suite holds the merge; `publish` approves it. Needs
# Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests", and
# Settings → General → "Allow auto-merge".
#
# `report` runs last, after every run: a stuck sync opens or updates an issue (README, "When the
# sync is stuck").
name: release-sync

on:
  # Sent by Vimma's site-dispatch.yml when a release is published. Its payload is not used: the
  # run syncs the latest published release, so it keeps the scheduled run's refusal to go back.
  repository_dispatch:
    types: [vimma-release]
  schedule:
    - cron: "17 * * * *" # hourly, at :17 (a run with nothing new ends in seconds)
  workflow_dispatch:
    inputs:
      tag:
        description: "Vimma release tag (vX.Y.Z); empty for the latest published release"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-sync
  cancel-in-progress: false

env:
  SYNCED: >-
    data/release.json data/bindings.json data/bindings-source.json
    data/docs/guide.md data/docs/limits.md data/docs/source.json

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # find the open pull request for the release
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      tag: ${{ steps.branch.outputs.tag }}
      branch: ${{ steps.branch.outputs.branch }}
      reuse: ${{ steps.branch.outputs.reuse }}
      build_ok: ${{ steps.build.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Sync the release
        id: sync
        env:
          # Event data, so it goes through env and is checked before use.
          TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }} # the API's rate limit
        run: |
          if [[ -n "$TAG" && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          npm run release:sync -- ${TAG:+"$TAG"}
          # shellcheck disable=SC2086 # SYNCED is a list of paths
          if [[ -z "$(git status --porcelain -- $SYNCED)" ]]; then
            echo "The site is already on $(jq -r .tag data/release.json)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lay the sync on its branch
        id: branch
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag=$(jq -r .tag data/release.json)
          branch="release-sync/$tag"
          # Build on what the pull request will hold: the open one for this release, with any fix
          # pushed to it by hand (to scripts/docs-pages.ts, say), or else main. A branch with only
          # this workflow's commits that main has moved past is rebuilt on main (and force-pushed
          # by `publish`): its data/ changes would conflict with main's next sync, and a fix
          # merged to main since would not reach it.
          keep=$(mktemp -d)
          # shellcheck disable=SC2086
          cp --parents $SYNCED "$keep"
          git checkout --quiet -- data/
          git clean -fdq -- data/
          open=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq 'length')
          if [[ "$open" != "0" ]]; then
            read -r behind hand < <(gh api "repos/$REPO/compare/main...$branch" \
              --jq '[.behind_by, ([.commits[] | select(.author.login != "github-actions[bot]")] | length)] | @tsv')
            if [[ "$hand" == "0" && "$behind" != "0" ]]; then
              echo "$branch is $behind commit(s) behind main with no hand-made commits; rebuilding it on main"
              open=0
            fi
          fi
          if [[ "$open" != "0" ]]; then
            git fetch --quiet "https://github.com/$REPO" "$branch"
            git switch --quiet --detach FETCH_HEAD
            reuse=true
          else
            reuse=false
          fi
          cp -r "$keep/data" .
          {
            echo "tag=$tag"
            echo "branch=$branch"
            echo "reuse=$reuse"
          } >> "$GITHUB_OUTPUT"

      - name: Build and check
        id: build
        if: steps.sync.outputs.changed == 'true'
        run: |
          # A failure is reported in the pull request, which then stays red and does not merge;
          # it does not stop the workflow.
          if { npm run build && npm run check; } > build.log 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the site does not build with this release; see the pull request"
          fi
          cat build.log
          grep -E '^(Error: |✗ |\(the copy)' build.log > build-errors.log || tail -n 20 build.log > build-errors.log

      - if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sync
          path: |
            data/
            build-errors.log
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the branch
      pull-requests: write # open or update the pull request and turn on auto-merge
      actions: write # start ci.yml on the branch
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.sync.outputs.tag }}
      BRANCH: ${{ needs.sync.outputs.branch }}
      REUSE: ${{ needs.sync.outputs.reuse }}
      BUILD_OK: ${{ needs.sync.outputs.build_ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the hand-off and take the branch
        run: |
          # The values come from the other job; check them before use.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ && "$BRANCH" == "release-sync/$TAG" ]] \
            || { echo "::error::unexpected tag or branch: $TAG $BRANCH"; exit 1; }
          # `ls-remote --exit-code` exits 2 when the branch does not exist and 128 when the remote
          # cannot be read. Its status must reach the elif unchanged, so no pipe there: the step
          # has no pipefail, and a pipe's status would be its last command's.
          if [[ "$REUSE" == "true" ]]; then
            git fetch --quiet "https://github.com/$REPO" "$BRANCH"
            git switch --quiet -c "$BRANCH" FETCH_HEAD
          elif heads=$(git ls-remote --exit-code --heads "https://github.com/$REPO" "$BRANCH"); then
            old=${heads%%$'\t'*}
            open=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq 'length')
            if [[ "$open" == "0" ]]; then
              # Merged sync branches stay on the remote (GitHub did not delete them on merge), and a
              # later sync of the same release (a release.json edited by hand, say) meets one. A
              # branch still at the commit a merged pull request took holds nothing main lacks, so
              # it is replaced. Any other branch is left from a closed pull request: building on it
              # would carry a stale diff, and deleting it could lose commits someone pushed to it.
              merged=$(gh pr list --repo "$REPO" --head "$BRANCH" --state merged --limit 100 --json headRefOid \
                --jq "map(select(.headRefOid == \"$old\")) | length")
              if [[ "$merged" == "0" ]]; then
                echo "::error::$BRANCH exists without an open pull request; delete it to let the sync reopen one"
                exit 1
              fi
              echo "$BRANCH is left from a merged pull request; replacing it"
            fi
            # `sync` rebuilt the open pull request's stale branch on main, or the branch is left from
            # a merged one; replace it, unless it moved since that check.
            echo "LEASE=$old" >> "$GITHUB_ENV"
            git switch --quiet -c "$BRANCH"
          elif [[ $? -eq 2 ]]; then
            # No such branch on the remote: the release's first sync.
            git switch --quiet -c "$BRANCH"
          else
            echo "::error::could not read $BRANCH from the remote"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sync
          path: ${{ runner.temp }}/release-sync

      - name: Commit and push
        id: push
        env:
          FROM: ${{ runner.temp }}/release-sync
        run: |
          set -o pipefail
          for f in $SYNCED; do cp "$FROM/$f" "$f"; done
          read -r version firefox commit < <(jq -r '[.version, .firefox, .commit] | join(" ")' data/release.json)
          [[ "$version" == "${TAG#v}" && "$firefox" =~ ^[0-9.]+$ && "$commit" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::data/release.json does not match $TAG"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git add -- $SYNCED
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit --quiet -m "chore(release): sync the site with vimma $TAG" -m "Vimma $version (Firefox $firefox) is the latest published release. This copies its
          facts, docs/guide.md, docs/limits.md and docs/bindings.json at the tag's commit (${commit:0:7}),
          so the pages, the docs and the keys describe the release a visitor downloads."
          # gh as git's credential helper, so the token is never on a command line
          gh auth setup-git
          git push --quiet ${LEASE:+"--force-with-lease=refs/heads/$BRANCH:$LEASE"} origin "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        env:
          FROM: ${{ runner.temp }}/release-sync
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          set -o pipefail
          read -r firefox commit url < <(jq -r '[.firefox, .commit, .url] | join(" ")' data/release.json)
          title="chore(release): sync the site with vimma $TAG"
          {
            echo "Vimma [$TAG]($url) (Firefox $firefox) is the latest published release. This copies"
            echo "its facts into \`data/release.json\` and Vimma's \`docs/guide.md\`, \`docs/limits.md\` and"
            echo "\`docs/bindings.json\` at the tag's commit, vimma-browser/vimma@$commit, into \`data/\`."
            echo
            if [[ "$BUILD_OK" == "true" ]]; then
              echo "The site builds and passes \`npm run check\` with it. Auto-merge (squash) is on: it"
              echo "merges once the required checks pass."
            else
              echo "**The site does not build with this release, so this pull request stays red and is"
              echo "not set to merge.** Usually a guide heading, paragraph or limits section that"
              echo "\`scripts/docs-pages.ts\` names was renamed or removed upstream. The build says which:"
              echo
              echo '~~~'
              cat "$FROM/build-errors.log"
              echo '~~~'
              echo
              echo "Fix \`scripts/docs-pages.ts\` (or the page) on this branch, then merge it by hand."
              echo "The next run keeps your commits and adds its own on top."
            fi
            echo
            echo "Opened by \`.github/workflows/release-sync.yml\`, which started CI on the branch with"
            echo "\`workflow_dispatch\` and approved this pull request's own \`ci\` run."
          } > "$RUNNER_TEMP/pr-body.md"

          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr edit "$pr" --repo "$REPO" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
          if [[ "$PUSHED" == "true" ]]; then
            gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
            # Approve the pull request's ci run for this commit, which waits for a maintainer
            # (see the top of this file). It appears a few seconds after the push.
            head=$(git rev-parse HEAD)
            for _ in $(seq 1 12); do
              ids=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&status=action_required" --jq '.workflow_runs[].id')
              [[ -n "$ids" ]] && break
              sleep 5
            done
            for id in $ids; do
              gh api --method POST "repos/$REPO/actions/runs/$id/approve" >/dev/null && echo "approved ci run $id" \
                || echo "::warning::could not approve ci run $id; approve it on the pull request so it can merge"
            done
          fi
          if [[ "$BUILD_OK" == "true" ]]; then
            gh pr merge "$BRANCH" --repo "$REPO" --auto --squash \
              || echo "::warning::could not turn on auto-merge: is Settings → General → Allow auto-merge on?"
          else
            gh pr merge "$BRANCH" --repo "$REPO" --disable-auto 2>/dev/null || true
          fi

          # A sync for an older release that never merged is superseded by this one. Its branch
          # stays, with any fix pushed to it, for whoever wants to carry the fix over.
          gh pr list --repo "$REPO" --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"release-sync/\")) | select(.headRefName != \"$BRANCH\") | .number" |
            while read -r old; do
              gh pr close "$old" --repo "$REPO" --comment "Superseded by the sync for $TAG."
            done

  # A stuck sync is never silent: a failed job, a release the site does not build with, or a sync
  # pull request with a failed check or still open two hours after it opened, opens the issue
  # named below (or updates it when it is open) and fails this job, so the run is red and its
  # summary links the issue. The next run that finds nothing stuck closes it. It runs no
  # repository code and holds only what it needs: issues to write, pull requests and checks to read.
  report:
    needs: [sync, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # open, update or close the alert issue
      pull-requests: read # find a stuck sync pull request
      checks: read # its checks
      statuses: read # and its commit statuses
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SYNC_RESULT: ${{ needs.sync.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      BUILD_OK: ${{ needs.sync.outputs.build_ok }}
      TAG: ${{ needs.sync.outputs.tag }}
    steps:
      - name: Report a stuck sync
        run: |
          set -o pipefail
          title="release-sync: the site is not following Vimma's releases"
          problems=()
          for job in sync publish; do
            var="${job^^}_RESULT"
            result=${!var}
            [[ "$result" == "success" || "$result" == "skipped" ]] || problems+=("The \`$job\` job ended in $result.")
          done
          # From the job that runs npm code: checked before it goes into the issue.
          [[ -z "$TAG" || "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || TAG="(an unexpected tag)"
          if [[ "$BUILD_OK" == "false" ]]; then
            problems+=("The site does not build with $TAG, so its pull request is not set to merge.")
          fi
          # Open sync pull requests with a failed check, or open for more than two hours: one that
          # passes its checks merges itself within minutes.
          stuck=$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,headRefName,isCrossRepository,url,createdAt,statusCheckRollup --jq '
              .[] | select((.isCrossRepository | not) and (.headRefName | startswith("release-sync/")))
              | ([.statusCheckRollup[]? | select((.conclusion // .state // "") as $c
                  | ["FAILURE", "ERROR", "TIMED_OUT", "CANCELLED", "ACTION_REQUIRED", "STARTUP_FAILURE"]
                  | index($c)) | (.name // .context)] | unique) as $failed
              | ((now - (.createdAt | fromdateiso8601)) / 3600 | floor) as $hours
              | select(($failed | length) > 0 or $hours >= 2)
              | "\(.url) " + (if ($failed | length) > 0 then "has failed checks: \($failed | join(", "))."
                               else "has been open for \($hours) hours without merging." end)')
          while read -r line; do
            if [[ -n "$line" ]]; then problems+=("The sync pull request $line"); fi
          done <<< "$stuck"
          # Only an issue this workflow opened: anyone can open one with the same title.
          issue=$(gh issue list --repo "$REPO" --author app/github-actions --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$title\") | .number][0] // empty")

          if (( ${#problems[@]} == 0 )); then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --repo "$REPO" \
                --comment "The release-sync run $RUN_URL ($EVENT) found nothing stuck: the site follows Vimma's latest published release again."
            fi
            exit 0
          fi

          body="$RUNNER_TEMP/alert.md"
          [[ -n "$RUNNER_TEMP" ]] || body=$(mktemp)
          {
            echo "vimma.dev did not follow Vimma's latest published release. The latest release-sync"
            echo "run that found this: $RUN_URL ($EVENT, $(date -u '+%Y-%m-%d %H:%M UTC'))."
            echo
            for p in "${problems[@]}"; do echo "- $p"; done
            echo
            echo "The run's log says more. The README of this repository, \"Keeping up with releases\","
            echo "describes the flow and what to do. This issue is updated by every run that finds the"
            echo "sync stuck, and closed by the first run that does not."
          } > "$body"
          if [[ -z "$issue" ]]; then
            url=$(gh issue create --repo "$REPO" --title "$title" --body-file "$body")
          else
            gh issue edit "$issue" --repo "$REPO" --body-file "$body" > /dev/null
            url="https://github.com/$REPO/issues/$issue"
          fi
          {
            echo "### The release sync is stuck"
            echo
            for p in "${problems[@]}"; do echo "- $p"; done
            echo
            echo "Reported in $url."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::the release sync is stuck; see $url"
          exit 1
