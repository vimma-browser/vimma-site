# Build and check the site on every push and pull request. Deployment is Cloudflare Workers
# Builds' own build of main (see README, "Deploying"), not this workflow.
name: ci

on:
  push:
  pull_request:
  # release-sync.yml starts it on the branches it opens pull requests from: pushes made with
  # GITHUB_TOKEN start no push or pull_request runs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: No process wording in the Markdown, the pages or code comments
        run: npm run wording
      - run: npm run build
      - run: npm run check
