# Refresh data/bindings.json from Vimma's docs/bindings.json and open a pull request (README,
# "Keeping the keys current"). Vimma's site-dispatch.yml sends the repository_dispatch when the
# file changes on its main; it can also be run by hand, with or without a commit.
#
# A pull request opened with GITHUB_TOKEN starts no pull_request or push workflows, so this starts
# ci.yml on the branch itself (workflow_dispatch is the exception GitHub allows). Needs Settings →
# Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: sync-keys

on:
  repository_dispatch:
    types: [vimma-bindings]
  workflow_dispatch:
    inputs:
      commit:
        description: "Vimma commit (full or short hash); empty for the latest on main"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sync-keys
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the branch
      pull-requests: write # open the pull request
      actions: write # start ci.yml on the branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch docs/bindings.json
        env:
          # Event data, so it goes through env and is checked before use.
          REF: ${{ github.event.client_payload.sha || inputs.commit || 'main' }}
          GITHUB_TOKEN: ${{ github.token }} # the API's rate limit, for resolving the commit
        run: |
          if ! [[ "$REF" =~ ^([0-9a-f]{7,40}|main)$ ]]; then
            echo "::error::not a commit: $REF"
            exit 1
          fi
          npm run keys:sync -- "$REF"

      - name: Build and check
        run: npm run build && npm run check

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- data/; then
            echo "data/bindings.json is already current"
            exit 0
          fi
          commit=$(node -p 'require("./data/bindings-source.json").commit')
          short=${commit:0:7}
          branch="keys/vimma-$short"
          if git ls-remote --exit-code --heads "https://github.com/$REPO" "$branch" >/dev/null; then
            echo "$branch already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/bindings.json data/bindings-source.json
          git commit -m "chore(keys): sync vimma's bindings at $short" \
            -m "Vimma's docs/bindings.json changed (JRanne/vimma@$commit); this copies it for the keys page and the ? overlay."
          git push "https://x-access-token:$GH_TOKEN@github.com/$REPO" "$branch"
          gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "chore(keys): sync vimma's bindings at $short" \
            --body "Vimma's default bindings changed in JRanne/vimma@$commit. This copies its \`docs/bindings.json\` into \`data/bindings.json\` (opened by \`sync-keys.yml\`). CI was started on the branch with \`workflow_dispatch\`."
          gh workflow run ci.yml --repo "$REPO" --ref "$branch"
