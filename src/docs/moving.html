<!-- Hand-written intro for the moving page. -->
<p>In normal mode the page is yours to move around without the mouse: <kbd>j</kbd> and <kbd>k</kbd> scroll, <kbd>f</kbd> labels every link so you can follow one by typing its label, <kbd>/</kbd> finds text, and <kbd>H</kbd>, <kbd>L</kbd> and <kbd>r</kbd> go back, forward and reload.</p>
