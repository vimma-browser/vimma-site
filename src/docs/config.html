<!-- Hand-written intro for the config page. -->
<p>Everything you can change lives in one file, <code>~/.config/vimma/config.toml</code>: key bindings, per-site insert behaviour, panes, theme colours and workspaces. Save it and Vimma picks it up within two seconds. A mistake never breaks your setup: the file is rejected whole, and the status bar says where.</p>
